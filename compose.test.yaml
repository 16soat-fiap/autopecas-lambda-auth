services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autopecas_test
      POSTGRES_USER: autopecas_test
      POSTGRES_PASSWORD: autopecas_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./src/test/resources/db/schema-e-dados.sql:/docker-entrypoint-initdb.d/01-schema-e-dados.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U autopecas_test -d autopecas_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
